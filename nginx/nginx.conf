worker_processes auto;

events {
    worker_connections 1024;
}

http {
    
    log_format lb '$remote_addr [$time_local] "$request" $status '
                  'upstream=$upstream_addr up_status=$upstream_status '
                  'req_time=$request_time up_time=$upstream_response_time';

    access_log /var/log/nginx/access.log lb;
    error_log  /var/log/nginx/error.log warn;


    upstream teachua_backend {

        least_conn;

        server backend1:8080 max_fails=3 fail_timeout=10s;
        server backend2:8080 max_fails=3 fail_timeout=10s;

    }

    server {
        listen 80;
        server_name _;

        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://teachua_backend;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 3s;
            proxy_read_timeout    60s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;

            add_header X-Served-By $upstream_addr always;
        }
    }
}
