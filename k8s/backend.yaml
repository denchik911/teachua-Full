apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: teachua
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: teachua-backend:demo1
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: JDBC_DRIVER
              value: org.mariadb.jdbc.Driver
            - name: DATASOURCE_URL
              value: jdbc:mariadb://db:3306/teachua
            - name: DATASOURCE_USER
              value: teachua
            - name: DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DB_PASSWORD
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1536Mi
          startupProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: teachua
spec:
  type: NodePort
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
