apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: teachua
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: mariadb
          image: mariadb:10.11
          args: [--character-set-server=utf8, --collation-server=utf8_bin]
          ports:
            - containerPort: 3306
          env:
            - name: MARIADB_DATABASE
              value: teachua
            - name: MARIADB_USER
              value: teachua
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DB_PASSWORD
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DB_ROOT_PASSWORD
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            exec:
              command: [healthcheck.sh, --connect, --innodb_initialized]
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            exec:
              command: [healthcheck.sh, --connect, --innodb_initialized]
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: db-data
        - name: init
          configMap:
            name: db-init
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: teachua
spec:
  selector:
    app: db
  ports:
    - port: 3306
      targetPort: 3306
